name: ML-CI/CD — Wind Power Prediction Pipeline

# Mirrors thesis Section 4.2.4 / 5.3.2.2: GitHub Actions automates testing,
# training, drift-gated validation, and deployment on every push / PR to
# main, or manually via workflow_dispatch.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Nightly retrain, matching Chapter 4's "trigger" node in the automated
    # pipeline (batch fetching -> retrain -> re-validate).
    - cron: "0 3 * * *"

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest tests/ -v

  pipeline:
    name: Data → Train → Monitor (DVC pipeline)
    needs: test
    runs-on: ubuntu-latest
    env:
      # Points MLflow tracking at the hosted DagsHub server instead of the
      # local sqlite file — leave these repo secrets unset to fall back to
      # local sqlite:///mlflow.db (see src/config.py).
      MLFLOW_TRACKING_URI: ${{ secrets.DAGSHUB_MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Configure DVC remote auth (DagsHub)
        if: ${{ secrets.DAGSHUB_TOKEN != '' }}
        run: |
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user "${{ secrets.DAGSHUB_USERNAME }}"
          dvc remote modify origin --local password "${{ secrets.DAGSHUB_TOKEN }}"
      - name: Pull versioned data (DVC)
        run: dvc pull || echo "Remote unreachable or empty — using data checked into the workspace"
      - name: Reproduce pipeline (data → preprocessing → train → monitor)
        run: dvc repro
      - name: Push updated data/model versions (DVC)
        run: dvc push || echo "DVC push failed — check DagsHub remote auth"
      - name: Gate on data drift
        id: drift_gate
        run: |
          python - <<'PY'
          import json, sys
          summary = json.load(open("reports/evidently/drift_summary.json"))
          share = summary["drift_share"]
          print(f"Drift share: {share:.1%}")
          # Non-blocking by default: flag loudly but let CML/reviewers decide.
          # Flip to `sys.exit(1)` to hard-block deploys on severe drift.
          if share > 0.5:
              print("::warning::Significant data drift detected — recommend retraining before deploy")
          PY
      - name: Upload experiment & monitoring artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-reports
          path: |
            reports/
            models/best_model.pkl
            mlflow.db

  deploy:
    name: Deploy Streamlit app to Render
    needs: pipeline
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
