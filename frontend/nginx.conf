server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin proxy to the FastAPI backend (docker-compose service name
    # "backend") so the built JS never needs a hardcoded API host and no
    # CORS handling is needed in production.
    #
    # On a standalone deploy (e.g. Render), the frontend is instead built
    # with an absolute VITE_API_URL (see Dockerfile) and never hits this
    # location at all — but nginx still resolves proxy_pass hostnames at
    # startup and would otherwise crash the whole container if "backend"
    # doesn't exist. Using a variable forces lazy, per-request DNS
    # resolution via Docker's embedded resolver (127.0.0.11) instead, so
    # nginx boots fine either way.
    #
    # Note: proxy_pass with a variable upstream disables nginx's usual
    # automatic /api/ prefix-stripping, so it's done explicitly via rewrite
    # instead (otherwise /api/health would be forwarded as literally
    # "/api/health" instead of "/health").
    resolver 127.0.0.11 valid=10s;
    location /api/ {
        set $backend_upstream backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
